<!DOCTYPE html>
<html lang="en" dir="ltr">

<title>The Oracle ∞</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,300;0,500;1,300&display=swap">
<style>
:root{--void:#0a0620;--mist:#e9e4ff;--dim:#a79fd0;--aurora:#5df2d6;--arcane:#b46bff;--ember:#ffc86b;--blood:#ff6b9d;--glass:rgba(24,14,60,.62);--edge:rgba(180,107,255,.4)}
*{box-sizing:border-box;margin:0}
body{background:var(--void);color:var(--mist);font:300 1.06rem/1.55 "Spectral",Georgia,serif;overflow-x:hidden;min-height:100vh}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
#scene{position:fixed;inset:0;z-index:1;perspective:900px;pointer-events:none;overflow:hidden}
#world{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.o{position:absolute;left:0;top:0;transform-style:preserve-3d}
.cube{position:absolute;transform-style:preserve-3d;animation:cs 26s linear infinite}
.f{position:absolute;inset:0;border:1px solid var(--arcane);background:rgba(180,107,255,.07);box-shadow:inset 0 0 40px rgba(93,242,214,.25),0 0 20px rgba(180,107,255,.3)}
.f:nth-child(1){transform:translateZ(var(--h))}.f:nth-child(2){transform:rotateY(90deg) translateZ(var(--h))}.f:nth-child(3){transform:rotateY(180deg) translateZ(var(--h))}
.f:nth-child(4){transform:rotateY(-90deg) translateZ(var(--h))}.f:nth-child(5){transform:rotateX(90deg) translateZ(var(--h))}.f:nth-child(6){transform:rotateX(-90deg) translateZ(var(--h))}
.ring{position:absolute;border-radius:50%;border:2px solid var(--aurora);box-shadow:0 0 30px var(--aurora),inset 0 0 30px var(--aurora);opacity:.45}
@keyframes cs{from{transform:rotateX(20deg) rotateY(0)}to{transform:rotateX(20deg) rotateY(360deg)}}
@keyframes r1{from{transform:rotateX(70deg) rotateZ(0)}to{transform:rotateX(70deg) rotateZ(360deg)}}
@keyframes r2{from{transform:rotateY(70deg) rotateZ(0)}to{transform:rotateY(70deg) rotateZ(-360deg)}}
body[data-gfx=low] #scene,body.rm #scene{display:none}body[data-gfx=med] .rg{display:none}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(93,242,214,.5),rgba(180,107,255,.3) 45%,transparent 70%)}
#flash.on{animation:fa .7s}@keyframes fa{30%{opacity:.5}to{opacity:0}}
main{position:relative;z-index:2;max-width:740px;margin:0 auto;padding:2rem 1rem 3rem}
h1,h2,h3{font-family:"Cinzel",Georgia,serif;font-weight:700;letter-spacing:.06em;text-align:center}
h1{font-size:clamp(2rem,7vw,3rem);background:linear-gradient(90deg,var(--aurora),var(--arcane),var(--ember),var(--aurora));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fl 9s linear infinite;filter:drop-shadow(0 0 14px rgba(180,107,255,.6))}
@keyframes fl{to{background-position:300% 0}}
h2{font-size:1.3rem;color:var(--ember);text-shadow:0 0 12px rgba(255,200,107,.5);margin-bottom:.6rem}
h3{font-size:1rem;color:var(--aurora);text-align:left;margin:1.2rem 0 .3rem}
.sub{text-align:center;color:var(--dim);font-style:italic;margin:.4rem 0 1.5rem}
#tilt{perspective:1000px}
#app{background:var(--glass);border:1px solid var(--edge);border-radius:20px;padding:1.5rem;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 50px rgba(120,60,255,.3),inset 0 0 30px rgba(93,242,214,.06);animation:en .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes en{from{opacity:0;filter:blur(8px);transform:rotateY(-24deg) translateZ(-140px) scale(.94)}to{opacity:1;filter:none;transform:none}}
button{font:inherit;font-weight:500;color:var(--mist);cursor:pointer;position:relative;background:rgba(60,35,130,.45);border:1px solid var(--edge);border-radius:14px;padding:.85rem 1.05rem;transition:transform .25s,box-shadow .25s,border-color .25s}
button:hover:not(:disabled),button:focus-visible{border-color:var(--aurora);box-shadow:0 0 24px rgba(93,242,214,.45);transform:translateY(-3px) scale(1.02)}
:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
h2:focus-visible,.q:focus-visible,#app:focus-visible{outline:none}
button:disabled{cursor:default}
button.sel{border-color:var(--c,var(--ember));background:rgba(255,255,255,.1);box-shadow:0 0 26px var(--c,var(--ember))}
.menu{display:grid;gap:.9rem;margin:1rem 0}
.menu button{text-align:left;display:flex;gap:1rem;align-items:center}
.ic{font-size:1.9rem;filter:drop-shadow(0 0 10px var(--arcane))}
small{display:block;color:var(--dim);font-weight:300;font-size:.88rem}
.cta{display:block;width:100%;margin-top:1rem;text-align:center;background:linear-gradient(135deg,#6a2fd6,#1fa8a0);border:0;font-family:"Cinzel",serif;letter-spacing:.08em;box-shadow:0 0 24px rgba(180,107,255,.5)}
.cta:disabled{opacity:.4}
.ghost{background:none;font-size:.9rem;padding:.4rem .8rem;margin-top:.8rem}
.bar,.tb{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin-bottom:1rem;overflow:hidden}
.bar i,.tb i{display:block;height:100%;background:linear-gradient(90deg,var(--arcane),var(--aurora));box-shadow:0 0 12px var(--aurora);transition:width .5s}
.tb i{width:100%;transition:none;background:linear-gradient(90deg,var(--ember),var(--aurora))}
.meta{display:flex;justify-content:space-between;color:var(--dim);font-size:.9rem}
.q{font-size:1.2rem;margin:.6rem 0 1rem;text-align:center}
.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:.55rem;margin-bottom:1.2rem}
.mx{display:grid;grid-template-columns:repeat(3,64px);gap:.4rem;justify-content:center;margin-bottom:1.2rem}.mx .cell{width:64px;height:64px}
.cell{width:84px;height:84px;display:grid;place-items:center;border-radius:14px;background:rgba(8,4,26,.6);border:1px solid var(--edge);box-shadow:0 0 18px rgba(180,107,255,.2);animation:pop .6s both}
.cell svg{max-width:100%;max-height:100%;filter:drop-shadow(0 0 6px currentColor)}
.cell:nth-child(2){animation-delay:.08s}.cell:nth-child(3){animation-delay:.16s}.cell:nth-child(4){animation-delay:.24s}.cell:nth-child(5){animation-delay:.32s}
@keyframes pop{from{opacity:0;transform:translateZ(-200px) rotateX(60deg)}to{opacity:1;transform:none}}
.cell.qm{font:700 2rem "Cinzel",serif;color:var(--ember);border-color:var(--ember);animation:pop .6s .4s both,pl 1.8s 1s infinite}
@keyframes pl{50%{box-shadow:0 0 30px var(--ember)}}
.num{font:700 1.4rem "Cinzel",serif;color:var(--aurora);text-shadow:0 0 12px var(--aurora)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem}
.opt{display:grid;place-items:center;padding:.5rem;min-height:88px}
.opt.ok{border-color:var(--aurora);box-shadow:0 0 30px var(--aurora);background:rgba(31,168,160,.3)}
.opt.no{border-color:var(--blood);box-shadow:0 0 30px var(--blood);animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hint-b{background:none;font-size:.9rem;display:block;margin:1rem auto 0}
.fb{text-align:center;margin-top:1rem}.fb p{color:var(--dim);font-style:italic;font-size:.95rem}
.ok-t{color:var(--aurora);text-shadow:0 0 12px var(--aurora)}.no-t{color:var(--blood);text-shadow:0 0 12px var(--blood)}
.big{font:700 clamp(2.6rem,12vw,4.2rem) "Cinzel",serif;text-align:center;color:var(--ember);text-shadow:0 0 30px rgba(255,200,107,.75)}
.stats{display:flex;justify-content:center;gap:1.2rem;color:var(--dim);flex-wrap:wrap;font-size:.95rem}.stats b{color:var(--mist);font-weight:500}
.note{color:var(--dim);font-size:.85rem;text-align:center;margin-top:1rem;font-style:italic}
.chk{display:flex;gap:.7rem;align-items:center;margin:.8rem 0;font-size:.95rem}.chk input{accent-color:var(--arcane);width:18px;height:18px}.chk input[type=range]{width:100%}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;margin-top:1.2rem}.lk button{padding:.7rem .3rem;font-size:.82rem;text-align:center;min-height:62px}
.ax{display:grid;grid-template-columns:1.6rem 1fr 1.6rem;gap:.6rem;align-items:center;margin-top:.9rem;font-family:"Cinzel",serif;color:var(--ember)}
.ax span:last-child{text-align:right}.ax div{height:12px;border-radius:12px;background:rgba(255,255,255,.1);overflow:hidden;display:flex}
.ax i{display:block;height:100%;transition:width 1.2s .3s}.ax i:first-child{background:linear-gradient(90deg,var(--arcane),#d9a6ff)}.ax i:last-child{background:linear-gradient(90deg,#7ff7e3,var(--aurora))}
details{margin:.3rem 0;color:var(--dim);font-size:.92rem}summary{cursor:pointer;color:var(--mist)}details li{margin:.3rem 0 0 1.2rem}
.rep p,.rep li{font-size:.98rem;margin:.3rem 0}.rep ul{margin-left:1.2rem}
.warn{border:1px solid var(--edge);border-radius:12px;padding:.8rem 1rem;color:var(--dim);font-size:.9rem;margin-top:1rem;background:rgba(0,0,0,.2)}
svg.radar text{fill:var(--mist);font:600 13px "Cinzel",serif}
.gear{position:fixed;top:12px;right:12px;z-index:5;width:46px;height:46px;border-radius:50%;padding:0;font-size:1.3rem}
#set{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(5,2,18,.75);backdrop-filter:blur(6px);padding:1rem}#set.open{display:grid}
.panel{background:#150c38;border:1px solid var(--edge);border-radius:20px;padding:1.5rem;width:100%;max-width:400px;box-shadow:0 0 60px rgba(120,60,255,.4)}
.seg{display:flex;gap:.4rem;margin:.4rem 0}.seg button{flex:1;padding:.5rem}.lab{color:var(--dim);font-size:.9rem;margin-top:.8rem}
#app.quick{animation-duration:.35s}
.load{display:flex;gap:.8rem;align-items:center;justify-content:center;padding:2rem;color:var(--dim)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--edge);border-top-color:var(--aurora);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin:1rem 0}.chips span{border:1px solid var(--edge);border-radius:999px;padding:.25rem .8rem;font-size:.88rem;color:var(--dim)}
.exit{padding:.15rem .6rem;font-size:.8rem;margin-left:.5rem;background:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-bottom:.6rem}
.rep ol li{margin:.5rem 0}
body.rm *{animation:none!important;transition:none!important}
@media(max-width:520px){.cell{width:58px;height:58px}.lk{grid-template-columns:1fr}.lk button{min-height:0}.grid{gap:.45rem}}

/* ===== v5: hub, games, RTL ===== */
.langbar{display:flex;gap:.4rem;justify-content:center;margin-bottom:1rem}.langbar button{padding:.3rem .9rem;font-size:.85rem;border-radius:999px}
.gm{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin:1rem 0}
.gm button{display:block;text-align:start;min-height:128px}.gm .ic{display:block;margin-bottom:.3rem;font-size:1.7rem}
.gm b{font-family:"Cinzel",serif;font-size:.92rem;display:block}.gm small{margin-top:.25rem}.gm em{display:block;color:var(--ember);font-style:normal;font-size:.8rem;margin-top:.4rem}
.menu button{text-align:start}.ltr{direction:ltr;unicode-bidi:isolate}
.seq,.mx,.num,.big{direction:ltr}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;max-width:380px;margin:1rem auto}
.mc{aspect-ratio:1;font-size:1.9rem;padding:0;background:none;border:0;perspective:600px}
.mc i{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;border:1px solid var(--edge);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s;font-style:normal}
.mc .bk{background:linear-gradient(135deg,#2b1665,#143a55)}.mc .fr{transform:rotateY(180deg);background:rgba(8,4,26,.85)}
.mc.up .bk{transform:rotateY(180deg)}.mc.up .fr{transform:none}.mc.ok .fr{border-color:var(--aurora);box-shadow:0 0 20px var(--aurora)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;max-width:320px;margin:1rem auto}
.pad{aspect-ratio:1;border-radius:22px;background:var(--p);color:var(--p);opacity:.5;padding:0;border:2px solid transparent}
.pad.lit{opacity:1;box-shadow:0 0 44px currentColor;transform:scale(1.05)}
.tiles{display:grid;gap:.4rem;max-width:340px;margin:1rem auto}.tile{aspect-ratio:1;font:700 1.5rem "Cinzel",serif;padding:0}.tile.blank{visibility:hidden}
.lights{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;max-width:340px;margin:1rem auto}
.lt{aspect-ratio:1;padding:0;border-radius:12px;background:rgba(8,4,26,.7)}.lt.on{background:radial-gradient(circle,#ffe9a8,var(--ember));box-shadow:0 0 22px var(--ember)}
.react{width:100%;min-height:220px;border-radius:20px;font:700 1.3rem "Cinzel",serif;margin-top:.5rem;padding:1rem}
.react.wait{background:rgba(255,107,157,.25);border-color:var(--blood)}.react.go{background:rgba(93,242,214,.45);border-color:var(--aurora);box-shadow:0 0 50px var(--aurora)}
.gear{right:auto;inset-inline-end:12px}
.meta+.bar{margin-top:.25rem}.meta b{color:var(--mist);font-weight:500}
[dir=rtl] .ax span:last-child{text-align:left}[dir=rtl] .ax span:first-child{text-align:right}
[lang=ar] body,[lang=ar] button,[lang=ar] input,[lang=ar] h2,[lang=ar] h3,[lang=ar] .cta,[lang=ar] .gm b,[lang=ar] .react{font-family:"Cairo","Segoe UI",Tahoma,sans-serif;letter-spacing:0}
[lang=ar] body{line-height:1.75}
@media(max-width:520px){.gm{grid-template-columns:1fr}.gm button{min-height:0}}
</style>
</head>

const prog=(n,t)=>`<div class="bar"><i style="width:${n/t*100}%"></i></div>`;
const COL=["#e9e4ff","#5df2d6","#b46bff","#ffc86b"];
function shp(s,z=72){
  if(typeof s!=="object")return `<span class="num">${s}</span>`;
  const[n,rot,f,sc,d,m]=s,r=40*sc,col=COL[f],v=k=>{const a=(-90+rot+360*k/n)*Math.PI/180;return[r*Math.cos(a),r*Math.sin(a)]};let g;
  g=n<3?`<circle r="${r}"`:`<polygon points="${Array.from({length:n},(_,k)=>v(k).map(x=>x.toFixed(1)).join(",")).join(" ")}"`;
  g+=` fill="${f?col:"none"}" fill-opacity=".3" stroke="${col}" stroke-width="3" stroke-linejoin="round"/>`;
  if(m&&n>=3){const[x,y]=v(0);g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="#fff"/>`}
  for(let k=0;k<d;k++)g+=`<circle cx="${(k-(d-1)/2)*9}" cy="0" r="3.2" fill="#fff"/>`;
  return `<svg viewBox="-50 -50 100 100" width="${z}" height="${z}" style="color:${col}">${g}</svg>`}

function pickRun(lv){ /* prefers puzzles not seen recently */
  const bank=BANK[lv]||[],seen=obj(store.get("oracle-seen",{})),s=new Set(Array.isArray(seen[lv])?seen[lv]:[]);
  let pool=bank.map((_,i)=>i).filter(i=>!s.has(i));if(pool.length<10){pool=bank.map((_,i)=>i);s.clear()}

function iqRun(lv,timed,done){

  function ask(){
    const q=qs[i],opts=shuffle([q.ans,...q.w]),same=o=>JSON.stringify(o)===JSON.stringify(q.ans);let t0=Date.now(),over=false,hint=false;

     <div class="${q.mx?"mx":"seq"}" role="img" aria-label="${t("lg_pat")}">${cells}</div>
     <div class="grid">${opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-label="${t("lg_opt",k+1)}">${shp(o,q.mx?54:68)}</button>`).join("")}</div>

      if(good){streak++;bestS=Math.max(bestS,streak);ok++;gain=Math.round(((hint?5:10)+Math.min(Math.max(streak-2,0),5)*2+(timed?Math.round(5*Math.max(0,1-dt/L.t)):0))*L.m);pts+=gain;sfx.ok();burst(b,L.c)}

  function result(){

     <div class="stats"><span>${t("lg_acc")} <b>${pct}%</b></span><span>${t("lg_pts")} <b>${pts}</b></span><span>${t("lg_bs")} <b>${bestS}</b></span><span>${t("lg_hints")} <b>${hints}</b></span><span>${t("lg_avg")} <b>${(spent/qs.length).toFixed(1)}s</b></span></div>

/* ===================== game 2: personality reflection ===================== */
const PQP=["E","I","E","I","E","I","S","N","S","N","S","N","T","F","T","F","T","F","J","P","J","P","J","P"];
const PAIRS=["EI","SN","TF","JP"],P8=["E","I","S","N","T","F","J","P"];
function mbIntro(done){
  RR=()=>mbIntro(done);go("mb");

   <button class="cta" id="gb2">${t("mb_begin")}</button><button class="ghost" id="bk">${t("back")}</button>`);
  $("#bk").onclick=done;$("#gb2").onclick=()=>{sfx.click();mbRun(done)}}
function mbRun(done){
  RR=null;const QT=I18N.raw("Q"),LK=I18N.raw("LK"),qs=shuffle(PQP.map((_,k)=>k)),ans={};let i=0;
  function ask(){
    const id=qs[i];go(i%2?"iq":"mb",true);
    show(`${prog(i,qs.length)}<div class="meta"><span>${t("mb_stmt",i+1,qs.length)}</span><span><button class="exit" id="ex">${t("exit")}</button></span></div>
     <p class="q" style="margin-top:2rem">${QT[id]}</p>
     <div class="lk">${LK.map((lb,k)=>`<button data-v="${k-2}" class="${ans[id]===k-2?"sel":""}">${lb}</button>`).join("")}</div>
     ${i?`<button class="ghost" id="pb">${t("prev")}</button>`:""}`,true);
    exitBtn();
    const r0=run,born=Date.now();let lock=false;
    app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{if(lock||Date.now()-born<300)return;lock=true;ans[id]=+b.dataset.v;sfx.click();b.classList.add("sel");
      setTimeout(()=>{if(r0!==run)return;i++;i<qs.length?ask():result()},180)});
    if(i)$("#pb").onclick=()=>{i--;ask()}}
  function result(){
    const QT2=I18N.raw("Q"),LD=I18N.raw("L"),DESC=I18N.raw("D");
    const R=PAIRS.map(p=>{const items=PQP.map((pole,k)=>({k,tx:QT2[k],pole,v:ans[k]??0})).filter(x=>p.includes(x.pole));
      const score=items.reduce((a,x)=>a+x.v*(x.pole===p[0]?1:-1),0),letter=score>=0?p[0]:p[1],d=Math.abs(score);
      const con=items.map(x=>({...x,c:x.v*(x.pole===letter?1:-1)}));
      return{p,score,letter,d,pa:Math.round((score+12)/24*100),lab:t("c"+(d<=2?0:d<=5?1:d<=8?2:3)),
        pro:con.filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,2),con:con.filter(x=>x.c<0).sort((a,b)=>a.c-b.c).slice(0,1)}});
    const type=R.map(x=>x.letter).join(""),clear=R.filter(x=>x.d>5).length;
    const pct=l=>{const x=R.find(r=>r.p.includes(l));return l===x.p[0]?x.pa:100-x.pa};
    const pos=(i2,rr)=>{const a=(-90+45*i2)*Math.PI/180;return[150+rr*Math.cos(a),150+rr*Math.sin(a)]};
    const poly=k=>P8.map((_,i2)=>pos(i2,k).map(x=>x.toFixed(1)).join(",")).join(" ");
    const radar=`<svg class="radar ltr" viewBox="0 0 300 300" role="img" aria-label="${t("rp_radar")}" style="width:100%;max-width:340px;display:block;margin:1rem auto">
      ${[25,50,75,100].map(k=>`<polygon points="${poly(k)}" fill="none" stroke="rgba(180,107,255,.3)"/>`).join("")}
      ${P8.map((l,i2)=>{const[x,y]=pos(i2,100),[tx2,ty]=pos(i2,124);return `<line x1="150" y1="150" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(180,107,255,.25)"/><text x="${tx2.toFixed(1)}" y="${(ty+5).toFixed(1)}" text-anchor="middle">${l}</text>`}).join("")}
      <polygon id="rp" points="${P8.map((l,i2)=>pos(i2,pct(l)).map(x=>x.toFixed(1)).join(",")).join(" ")}" fill="rgba(93,242,214,.25)" stroke="#5df2d6" stroke-width="2.5" style="transform-origin:150px 150px;transform:scale(0);transition:transform 1.3s cubic-bezier(.2,.9,.2,1)"/>
      ${P8.map((l,i2)=>{const[x,y]=pos(i2,pct(l));return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#ffc86b"/>`}).join("")}</svg>`;
    const axes=R.map(x=>`<div class="ax ltr"><span>${x.p[0]}</span><div><i style="width:0" data-w="${x.pa}"></i><i style="width:0" data-w="${100-x.pa}"></i></div><span>${x.p[1]}</span></div>
      <div class="stats" style="font-size:.85rem"><span>${x.pa}% ${x.p[0]}</span><b>${x.lab} · ${x.letter}</b><span>${100-x.pa}% ${x.p[1]}</span></div>
      <details><summary>${t("rp_infl")}</summary><ul>${x.pro.map(a=>`<li>${t("rp_push",a.tx,LK[a.v+2],x.letter)}</li>`).join("")||`<li>${t("rp_none")}</li>`}
      ${x.con.map(a=>`<li>${t("rp_pull",a.tx,LK[a.v+2])}</li>`).join("")}</ul></details>`).join("");
    const Ls=R.map(x=>LD[x.letter]);
    const rep=`<div class="rep"><h3>${t("rp_ov")}</h3><details><summary>${t("rp_how")}</summary><p>${t("rp_howt")}</p></details><p><b class="ltr">${type}</b>: ${DESC[type]}</p>
      <p>${t("rp_conf",clear,t(clear===4?"rp_c4":clear>=2?"rp_c2":"rp_c0"))}</p>
      ${R.map((x,i2)=>`<h3>${Ls[i2][0]} (${x.letter}) · ${x.lab}</h3><p>${Ls[i2][1]}${x.d<=5?t("rp_mid",x.pa,100-x.pa,LD[x.p.replace(x.letter,"")][0]):""}</p>`).join("")}
      <h3>${t("rp_str")}</h3><ul>${Ls.map(l=>`<li>${l[2]}</li>`).join("")}</ul>
      <h3>${t("rp_bl")}</h3><ul>${Ls.map(l=>`<li>${l[3]}</li>`).join("")}</ul>
      <h3>${t("rp_gr")}</h3><ul>${Ls.map(l=>`<li>${l[4]}</li>`).join("")}</ul></div>`;
    store.set("oracle-mb",{type,date:new Date().toISOString().slice(0,10)});
    go("res");sfx.done();
    show(`${prog(1,1)}<h2>${t("rp_h")}</h2><div class="big">${type}</div><p class="fb" style="text-align:center">${DESC[type]}</p>
     ${radar}<h3>${t("rp_dims")}</h3>${axes}${rep}
     <div class="warn">${t("rp_warn")}</div><button class="cta" id="nx">${t("tomenu")}</button>`);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{const rp=$("#rp");if(rp)rp.style.transform="scale(1)";app.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%")}));
    burst($(".big"),"#b46bff");$("#nx").onclick=done}
  ask()}

/* ===================== game 3: memory match ===================== */
function memPlay(n){
  RR=null;go("mb",true);
  const key=n===6?"mem-easy":"mem-hard",syms=shuffle(["🌙","⭐","🔮","🪐","☄️","🌌","🧿","🦉"]).slice(0,n),cards=shuffle([...syms,...syms]);
  let moves=0,found=0,open=[],lock=false;
  show(`${gameHead("mem",`<span id="mv">${t("moves")}: 0</span>`)}<div class="mem">${cards.map((s,i)=>`<button class="mc" data-i="${i}" aria-label="${t("card",i+1)}"><i class="bk">❔</i><i class="fr">${s}</i></button>`).join("")}</div>`,true);
  exitBtn();const r0=run,bs=[...app.querySelectorAll(".mc")];
  bs.forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;if(lock||b.classList.contains("up"))return;
    b.classList.add("up");b.setAttribute("aria-label",cards[i]);sfx.click();open.push(i);
    if(open.length<2)return;
    moves++;$("#mv").textContent=t("moves")+": "+moves;const[a,c]=open;open=[];
    if(cards[a]===cards[c]){[a,c].forEach(k=>bs[k].classList.add("ok"));sfx.ok();burst(bs[c],"#5df2d6");
      if(++found===n)finish(key,moves,true,"u_moves",t("mem_done",moves),()=>memPlay(n))}
    else{lock=true;sfx.no();setTimeout(()=>{if(r0!==run)return;[a,c].forEach(k=>{bs[k].classList.remove("up");bs[k].setAttribute("aria-label",t("card",k+1))});lock=false},800)}})}

/* ===================== game 4: pattern echo ===================== */
function echoPlay(){
  RR=null;go("mb",true);
  const cols=["#5df2d6","#b46bff","#ffc86b","#ff6b9d"],fr=[262,330,392,523],seq=[];let pos=0,accept=false;
  show(`${gameHead("echo",`<span id="rd"></span>`)}<p class="q" id="stt"></p><div class="pads">${cols.map((c,i)=>`<button class="pad" data-kbd="${i+1}" aria-label="${i+1}" style="--p:${c}"></button>`).join("")}</div>`,true);
  exitBtn();
  const r0=run,alive=()=>r0===run,pads=[...app.querySelectorAll(".pad")],wait=ms=>new Promise(r=>setTimeout(r,ms)),say=s=>{$("#stt").textContent=s};
  const flash=i=>{pads[i].classList.add("lit");tone(fr[i],.3,"sine",1.2);setTimeout(()=>pads[i].classList.remove("lit"),320)};
  const round=async()=>{
    accept=false;seq.push(Math.floor(Math.random()*4));$("#rd").textContent=t("echo_round",seq.length);say(t("echo_watch"));await wait(700);
    for(const i of seq){if(!alive())return;flash(i);await wait(600)}
    if(alive()){accept=true;pos=0;say(t("echo_you"))}};
  pads.forEach((p,i)=>p.onclick=()=>{
    if(!accept)return;flash(i);
    if(i!==seq[pos]){accept=false;sfx.no();const d=seq.length-1;say("");finish("echo",d,false,"u_rounds",t("echo_over",d),echoPlay);return}
    if(++pos===seq.length){accept=false;sfx.ok();setTimeout(()=>{if(alive())round()},800)}});
  round()}

/* ===================== game 5: sliding tiles ===================== */
function slidePlay(n){
  RR=null;go("mb",true);
  const N=n*n,key="slide-"+n;
  const nbs=i=>{const r=Math.floor(i/n),c=i%n,a=[];if(r>0)a.push(i-n);if(r<n-1)a.push(i+n);if(c>0)a.push(i-1);if(c<n-1)a.push(i+1);return a};
  const solved=b=>b.every((v,i)=>v===(i+1)%N);
  let b,blank,moves=0,done=false;
  do{b=[...Array(N).keys()].map(i=>(i+1)%N);blank=N-1;let prev=-1; /* shuffle by legal moves so the puzzle is always solvable */
    for(let k=0;k<N*30;k++){const c=nbs(blank).filter(x=>x!==prev),m=c[Math.floor(Math.random()*c.length)];[b[blank],b[m]]=[b[m],b[blank]];prev=blank;blank=m}}while(solved(b));
  show(`${gameHead("slide",`<span id="mv"></span>`)}<div class="tiles" id="tl" style="grid-template-columns:repeat(${n},1fr)"></div><button class="ghost" id="sh" style="display:block;margin:0 auto">${t("shuffle")}</button>`,true);
  exitBtn();const r0=run;
  const draw=()=>{$("#mv").textContent=t("moves")+": "+moves;
    $("#tl").innerHTML=b.map((v,i)=>`<button class="tile ltr${v?"":" blank"}" data-i="${i}" ${v?"":'disabled aria-hidden="true"'}>${v||""}</button>`).join("");
    $("#tl").querySelectorAll(".tile").forEach(x=>x.onclick=()=>move(+x.dataset.i))};
  const move=i=>{if(done||!nbs(blank).includes(i))return;[b[blank],b[i]]=[b[i],b[blank]];blank=i;moves++;sfx.click();draw();
    if(solved(b)){done=true;finish(key,moves,true,"u_moves",t("slide_win",moves),()=>slidePlay(n))}};
  $("#sh").onclick=()=>slidePlay(n);
  const kh=e=>{if(r0!==run){removeEventListener("keydown",kh);return}
    const m={ArrowUp:blank+n,ArrowDown:blank-n,ArrowLeft:blank+1,ArrowRight:blank-1}[e.key];
    if(m!==undefined&&nbs(blank).includes(m)){e.preventDefault();move(m)}};
  addEventListener("keydown",kh);draw()}

/* ===================== game 6: math sprint ===================== */
function mathPlay(){
  RR=null;go("iq",true);
  const TOTAL=45,ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));let left=TOTAL,ok=0,over=false,ans=0;
  show(`${gameHead("math",`<span id="mv"></span>`)}<div class="tb"><i id="tbi"></i></div><p class="big ltr" id="mq" style="font-size:2.4rem"></p><div class="grid" id="mo" style="grid-template-columns:repeat(2,1fr)"></div>`,true);
  exitBtn();
  const next=()=>{
    const lv=1+Math.floor(ok/4),op=["+","−","×"][ri(0,lv>1?2:1)];let a,b,r;
    if(op==="+"){a=ri(2,9*lv+5);b=ri(2,9*lv+5);r=a+b}else if(op==="−"){a=ri(5,9*lv+10);b=ri(1,a-1);r=a-b}else{a=ri(2,6+lv);b=ri(2,6+lv);r=a*b}
    const s=new Set([r]);while(s.size<4){const w=r+ri(1,Math.max(3,Math.round(r*.2)))*(Math.random()<.5?-1:1);if(w>=0)s.add(w)}
    ans=r;$("#mq").textContent=`${a} ${op} ${b}`;$("#mv").textContent=t("math_ok",ok);
    $("#mo").innerHTML=shuffle([...s]).map(v=>`<button class="opt ltr" data-n="${v}">${v}</button>`).join("");
    $("#mo").querySelectorAll(".opt").forEach(x=>x.onclick=()=>{if(over)return;if(+x.dataset.n===ans){ok++;sfx.ok()}else{left-=3;sfx.no()}next()})};
  next();
  tm=setInterval(()=>{if(paused())return;left-=.1;$("#tbi").style.width=Math.max(left/TOTAL,0)*100+"%";
    if(left<=0){clearInterval(tm);over=true;$("#mo").innerHTML="";$("#mv").textContent=t("math_ok",ok);finish("math",ok,false,"u_ok",t("math_done",ok),mathPlay)}},100)}

/* ===================== game 7: lights out ===================== */
function lightsPlay(){
  RR=null;go("menu",true);
  const N=5,g=Array(25).fill(0);let moves=0,over=false;
  const press=i=>{const r=Math.floor(i/N),c=i%N;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N)g[rr*N+cc]^=1})};
  do{g.fill(0);for(let k=0;k<12;k++)press(Math.floor(Math.random()*25))}while(g.every(x=>!x)); /* built from real presses, so always solvable */
  show(`${gameHead("lights",`<span id="mv"></span>`)}<p class="fb" style="text-align:center">${t("lights_goal")}</p><div class="lights" id="lg"></div><button class="ghost" id="nw" style="display:block;margin:0 auto">${t("lights_new")}</button>`,true);
  exitBtn();
  const draw=()=>{$("#mv").textContent=t("moves")+": "+moves;
    $("#lg").innerHTML=g.map((v,i)=>`<button class="lt${v?" on":""}" data-i="${i}" aria-pressed="${!!v}" aria-label="${Math.floor(i/N)+1},${i%N+1}"></button>`).join("");
    $("#lg").querySelectorAll(".lt").forEach(b=>b.onclick=()=>{if(over)return;press(+b.dataset.i);moves++;sfx.click();draw();
      if(g.every(x=>!x)){over=true;finish("lights",moves,true,"u_moves",t("lights_win",moves),lightsPlay)}})};
  $("#nw").onclick=lightsPlay;draw()}

/* ===================== game 8: reaction test ===================== */
function reactPlay(){
  RR=null;go("menu",true);
  let round=0,state="idle",t0=0,to=0;const res=[];
  show(`${gameHead("react")}<p class="q" id="rq">${t("react_round",1)}</p><button class="react" id="rb">${t("react_tap")}</button>`,true);
  exitBtn();const r0=run,rb=$("#rb");
  const setS=(cls,txt)=>{rb.className="react "+cls;rb.textContent=txt};
  const arm=()=>{state="wait";setS("wait",t("react_wait"));to=setTimeout(()=>{if(r0!==run)return;state="go";setS("go",t("react_go"));t0=performance.now()},1500+Math.random()*2500)};
  rb.onclick=()=>{
    if(state==="idle")arm();
    else if(state==="wait"){clearTimeout(to);state="idle";setS("wait",t("react_early"));sfx.no()}
    else if(state==="go"){const ms=Math.round(performance.now()-t0);res.push(ms);round++;sfx.click();
      if(round===5){const avg=Math.round(res.reduce((a,b)=>a+b,0)/5);state="done";rb.disabled=true;finish("react",avg,true,"u_ms",t("react_done",avg),reactPlay)}
      else{state="idle";setS("",t("react_ms",ms));$("#rq").textContent=t("react_round",round+1)}}}}

/* ===================== boot ===================== */
function boot(){
  try{BANK=PuzzleEngine.buildBanks(2026);if(BANK.length!==4||BANK.some(b=>b.length<10))throw new Error(t("err_bank"));welcome()}
  catch(err){fatal(err.message)}}
(()=>{const saved=store.get("oracle-lang",null),nav=(navigator.language||"en").slice(0,2);
  I18N.set(LANGS.includes(saved)?saved:LANGS.includes(nav)?nav:"en");applyLang()})();
addEventListener("error",e=>fatal(e.message||"Unexpected error"));
addEventListener("unhandledrejection",e=>fatal(String(e.reason)));
setTimeout(boot,0);
})();
